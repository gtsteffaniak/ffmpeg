name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version (default from sources.json release.ffmpeg_version)
        required: false
      update_latest:
        description: Mark this release as latest on GitHub (manual runs only; push uses release.mark_github_latest in sources.json)
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.version || github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io/gtstef
  IMAGE_NAME: ffmpeg

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - name: Determine version
        id: version
        run: |
          CATALOG_VERSION="$(go run -C tools/catalog . read release.ffmpeg_version)"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ "$VERSION" != "$CATALOG_VERSION" ]; then
              echo "Manual version ${VERSION} does not match catalog ${CATALOG_VERSION}" >&2
              exit 1
            fi
          else
            VERSION="$CATALOG_VERSION"
          fi
          MAKE_LATEST=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ github.event.inputs.update_latest }}" = "true" ] && MAKE_LATEST=true
          elif [ "$(go run -C tools/catalog . read release.mark_github_latest)" = "true" ]; then
            MAKE_LATEST=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          go run -C tools/catalog . validate

  build-amd64:
    name: Build amd64 (Linux + Windows)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FFMPEG_VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.version }}
      PLATFORM: linux/amd64
      FULL_IMAGE: docker.io/gtstef/ffmpeg:${{ needs.resolve-version.outputs.version }}-amd64
      STATIC_IMAGE: docker.io/gtstef/ffmpeg:${{ needs.resolve-version.outputs.version }}-static-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - name: Fetch sources
        run: make fetch-sources BUILD_VARIANT=full
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Full glibc (Debian bullseye) ---
      - name: Build debian-base
        run: make ci-build-component COMPONENT=debian-base BUILD_VARIANT=full
      - name: Build full image (no push)
        run: make ci-build-component COMPONENT=full BUILD_VARIANT=full CI_PUSH=false LOAD_IMAGE=true CI_FINAL_IMAGE=${{ env.FULL_IMAGE }}
      - name: Smoke test full image
        run: make ci-smoke-image VARIANT=full CI_FINAL_IMAGE=${{ env.FULL_IMAGE }} ARCH_SUFFIX=amd64
      - name: Push full image
        run: make ci-push-image CI_FINAL_IMAGE=${{ env.FULL_IMAGE }}

      # --- Static Alpine scratch ---
      - name: Build static components
        run: |
          for c in base graphics av1 x264-x265 modern-codecs vpx-avs image-formats audio processing; do
            make ci-build-component COMPONENT=$c BUILD_VARIANT=static
          done
      - name: Build static final (no push)
        run: make ci-build-component COMPONENT=final BUILD_VARIANT=static CI_PUSH=false LOAD_IMAGE=true CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }}
      - name: Smoke test static image
        run: make ci-smoke-image VARIANT=static CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }} ARCH_SUFFIX=amd64
      - name: Push static image
        run: make ci-push-image CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }}

      # --- Windows static (software encoders) ---
      - name: Build windows components
        run: make ci-build-component COMPONENT=windows-components BUILD_VARIANT=static
      - name: Build windows final
        run: make ci-build-component COMPONENT=windows BUILD_VARIANT=static
      - name: Package Windows
        run: make ci-package-windows-release TAG=${{ needs.resolve-version.outputs.version }}
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-artifacts/*-windows-*.zip
          retention-days: 7

  build-arm64:
    name: Build arm64 (Linux)
    needs: resolve-version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      FFMPEG_VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.version }}
      PLATFORM: linux/arm64
      FULL_IMAGE: docker.io/gtstef/ffmpeg:${{ needs.resolve-version.outputs.version }}-arm64
      STATIC_IMAGE: docker.io/gtstef/ffmpeg:${{ needs.resolve-version.outputs.version }}-static-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - name: Fetch sources
        run: make fetch-sources BUILD_VARIANT=full
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build debian-base
        run: make ci-build-component COMPONENT=debian-base BUILD_VARIANT=full
      - name: Build full image (no push)
        run: make ci-build-component COMPONENT=full BUILD_VARIANT=full CI_PUSH=false LOAD_IMAGE=true CI_FINAL_IMAGE=${{ env.FULL_IMAGE }}
      - name: Smoke test full image
        run: make ci-smoke-image VARIANT=full CI_FINAL_IMAGE=${{ env.FULL_IMAGE }} ARCH_SUFFIX=arm64
      - name: Push full image
        run: make ci-push-image CI_FINAL_IMAGE=${{ env.FULL_IMAGE }}

      - name: Build static components
        run: |
          for c in base graphics av1 x264-x265 modern-codecs vpx-avs image-formats audio processing; do
            make ci-build-component COMPONENT=$c BUILD_VARIANT=static
          done
      - name: Build static final (no push)
        run: make ci-build-component COMPONENT=final BUILD_VARIANT=static CI_PUSH=false LOAD_IMAGE=true CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }}
      - name: Smoke test static image
        run: make ci-smoke-image VARIANT=static CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }} ARCH_SUFFIX=arm64
      - name: Push static image
        run: make ci-push-image CI_FINAL_IMAGE=${{ env.STATIC_IMAGE }}

  release:
    name: Merge manifests and publish release
    needs: [resolve-version, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      FFMPEG_VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish per-arch images to GHCR
        run: |
          GHCR_IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          for tag in "${TAG}-amd64" "${TAG}-arm64" "${TAG}-static-amd64" "${TAG}-static-arm64"; do
            docker buildx imagetools create -t "${GHCR_IMAGE}:${tag}" "${REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      - name: Merge multi-arch manifests
        run: |
          make ci-merge-manifest TAG=${{ needs.resolve-version.outputs.version }}
          make ci-merge-manifest-static TAG=${{ needs.resolve-version.outputs.version }}

      - name: Publish multi-arch images to GHCR
        run: |
          GHCR_IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          for tag in "${TAG}" "${TAG}-static"; do
            docker buildx imagetools create -t "${GHCR_IMAGE}:${tag}" "${REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      - name: Package Linux release binaries
        run: |
          make ci-package-release TAG=${{ needs.resolve-version.outputs.version }}
          make ci-package-release-static TAG=${{ needs.resolve-version.outputs.version }}

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-artifacts

      - name: Generate release notes
        run: make generate-release-body RELEASE_BODY=release-notes.md

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: FFmpeg ${{ needs.resolve-version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: ${{ needs.resolve-version.outputs.make_latest == 'true' }}
          files: |
            release-artifacts/*-linux-*.tar.gz
            release-artifacts/*-windows-*.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
