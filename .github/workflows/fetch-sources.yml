name: Fetch sources

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fetch-sources-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fetch-sources:
    name: Validate catalog and fetch sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod

      - name: Validate sources.json
        run: go run -C tools/catalog . validate

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y bzip2 xz-utils

      - name: Fetch source packages
        run: make fetch-sources
