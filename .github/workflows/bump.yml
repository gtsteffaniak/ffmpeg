name: Automatic version updates

on:
  schedule:
    # Monday 16:00 UTC — weekly dependency check
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version_update:
    name: Update dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update source versions
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: make update

      - name: Remove backup file
        run: rm -f fetch-sources.sh.bak

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet fetch-sources.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency updates found:"
            git diff fetch-sources.sh
          fi

      - name: Prepare pull request metadata
        if: steps.changes.outputs.changed == 'true'
        id: pr
        run: |
          DATE=$(date -u +%Y-%m-%d)
          WEEK=$(date -u +%V)
          YEAR=$(date -u +%Y)

          echo "branch=automated/version-bump-${WEEK}-${YEAR}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          TITLE="chore(deps): update library versions (${DATE})"

          OLD_FFMPEG=$(git show HEAD:fetch-sources.sh | grep 'FFMPEG_VERSION:=' | head -1 | sed -E 's/.*FFMPEG_VERSION:=([0-9.]+).*/\1/')
          NEW_FFMPEG=$(./scripts/read-ffmpeg-version.sh)
          if [ -n "$OLD_FFMPEG" ] && [ -n "$NEW_FFMPEG" ] && [ "$OLD_FFMPEG" != "$NEW_FFMPEG" ]; then
            TITLE="chore(deps): update library versions - ffmpeg ${NEW_FFMPEG} (${DATE})"
          fi

          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: ${{ steps.pr.outputs.title }}
          title: ${{ steps.pr.outputs.title }}
          body: |
            Automated dependency version updates from `helper.go` (${{ steps.pr.outputs.date }}).

            Review version bumps in `fetch-sources.sh` before merging.
          branch: ${{ steps.pr.outputs.branch }}
          delete-branch: true
