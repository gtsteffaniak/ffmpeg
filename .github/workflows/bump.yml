name: Automatic version updates

on:
  schedule:
    # Monday 16:00 UTC — weekly dependency check
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version_update:
    name: Update dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/catalog/go.mod

      - name: Validate sources.json
        run: go run -C tools/catalog . validate

      - name: Update source versions
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: make update

      - name: Remove backup file
        run: rm -f sources.json.bak

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency updates found:"
            git diff sources.json
          fi

      - name: Prepare pull request metadata
        if: steps.changes.outputs.changed == 'true'
        id: pr
        run: |
          DATE=$(date -u +%Y-%m-%d)
          WEEK=$(date -u +%V)
          YEAR=$(date -u +%Y)

          echo "branch=automated/version-bump-${WEEK}-${YEAR}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          TITLE="chore(deps): update library versions (${DATE})"

          OLD_FFMPEG=$(git show HEAD:sources.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["release"]["ffmpeg_version"])')
          NEW_FFMPEG=$(go run -C tools/catalog . read release.ffmpeg_version)
          if [ -n "$OLD_FFMPEG" ] && [ -n "$NEW_FFMPEG" ] && [ "$OLD_FFMPEG" != "$NEW_FFMPEG" ]; then
            TITLE="chore(deps): update library versions - ffmpeg ${NEW_FFMPEG} (${DATE})"
          fi

          {
            echo "title=${TITLE}"
            echo "summary<<EOF"
            go run -C tools/catalog . bump-summary
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: ${{ steps.pr.outputs.title }}
          title: ${{ steps.pr.outputs.title }}
          body: |
            Automated dependency version updates from `sources.json` (${{ steps.pr.outputs.date }}).

            ${{ steps.pr.outputs.summary }}

            Review version bumps in `sources.json` before merging.
          branch: ${{ steps.pr.outputs.branch }}
          delete-branch: true
